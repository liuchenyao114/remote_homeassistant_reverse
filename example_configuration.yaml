# 推荐：不用改这个文件。
# 在 Home Assistant 里「设置 → 设备与服务 → 添加集成 → Remote Push」点按配置：
#   A 选 Hub（登记 agent），B 选 Agent（填 hub 地址与令牌）。
# 下面这份 YAML 仅用于希望用文件管理配置的场景，界面与 YAML 不要混用。

# 复制到 A 的 configuration.yaml（有公网，hub）
# secrets.yaml:
#   remote_push_secret: a-very-long-random-shared-secret

remote_push:
  role: hub
  agents:
    - agent_id: b
      secret: !secret remote_push_secret
      prefix: b_


# ---------------------------------------------------------------
# 复制到 B 的 configuration.yaml（无公网，agent）
# secrets.yaml:
#   remote_push_secret: a-very-long-random-shared-secret   # 与 A 一致
#   a_long_lived_token: <在 A 的个人资料里生成的长期访问令牌>

remote_push:
  role: agent
  agent_id: b
  secret: !secret remote_push_secret
  host: ha.example.com
  port: 443
  secure: true
  verify_ssl: true
  token: !secret a_long_lived_token

  include_domains:
    - sensor
    - binary_sensor
    - switch
    - light
    - climate
  exclude_entities:
    - sensor.internal_debug
